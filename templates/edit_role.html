{% extends "base.html" %}

{% block title %}Employee List - Employee Management System{% endblock %}

{% block content %}

<div class="content-wrapper">
    <h2>Edit Role</h2>
    
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    
    {% if roles_list %}
    <form method="POST" class="employee-form">
        <div class="form-group">
            <label for="role_name">Role Name *</label>
            <input type="text" id="role_name" name="role_name" required placeholder="Enter role name" value="{{ roles_list.role_name }}">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Role</button>
            <a href="{{ url_for('roles') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
    {% else %}
    <div class="alert alert-danger">Role not found.</div>
    <a href="{{ url_for('roles') }}" class="btn btn-secondary">Go Back</a>
    {% endif %}
</div>
{% endblock %}
