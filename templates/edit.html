{% extends "base.html" %}

{% block title %}Edit Employee - Employee Management System{% endblock %}

{% block content %}
<div class="form-wrapper">
    <h2>Edit Employee</h2>
    
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    
    {% if employee %}
    <form method="POST" class="employee-form">
        <div class="form-group">
            <label for="first_name">First Name *</label>
            <input type="text" id="first_name" name="first_name" required placeholder="Enter first name" value="{{ employee.first_name }}">
        </div>
        
        <div class="form-group">
            <label for="last_name">Last Name *</label>
            <input type="text" id="last_name" name="last_name" required placeholder="Enter last name" value="{{ employee.last_name }}">
        </div>
        
        <div class="form-group">
            <label for="roles_id">Role *</label>
            <select id="roles_id" name="roles_id" required>
                <option value="">Select a role</option>
                {% for roles_list in roles_list %}
                <option value="{{ roles_list.id }}" {% if roles_list.id == employee.roles_id %}selected{% endif %} >{{ roles_list.role_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="pay">Pay (Salary) *</label>
            <input type="number" id="pay" name="pay" required step="0.01" min="0" placeholder="Enter pay amount" value="{{ employee.pay }}">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Employee</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
    {% else %}
    <div class="alert alert-danger">Employee not found.</div>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Go Back</a>
    {% endif %}
</div>
{% endblock %}
